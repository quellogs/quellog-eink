<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quellog 设置</title>
  </head>
  <body>
    <main class="eink-shell">
      <section class="eink-panel">
        <header class="eink-header">
          <p class="eyebrow">QUELLOG</p>
          <h1>设备接口设置</h1>
        </header>

        <label class="field">
          <span>服务地址</span>
          <input
            id="base-url"
            name="base-url"
            autocomplete="url"
            placeholder="请输入服务地址"
          />
        </label>

        <label class="field">
          <span>用户名</span>
          <input
            id="username"
            name="username"
            autocomplete="username"
            placeholder="请输入用户名"
          />
        </label>

        <label class="field">
          <span>密码</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="请输入密码"
          />
        </label>

        <p id="hint" class="secondary-copy">正在读取配置...</p>
        <button id="save" class="primary-button" type="button">保存接口配置</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/src/settings.js"></script>
  </body>
</html>
