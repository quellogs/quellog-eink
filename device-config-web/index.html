<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quellog 配网</title>
  </head>
  <body>
    <main class="eink-shell">
      <section class="eink-panel">
        <header class="eink-header">
          <p class="eyebrow">QUELLOG</p>
          <h1>Wi-Fi 配网</h1>
        </header>

        <section id="selected-network" class="selected-network" data-state="loading">
          <span class="selected-label">墨水屏选择</span>
          <strong id="selected-ssid">读取中</strong>
          <span id="selected-source" class="selected-source">正在读取设备上的目标网络</span>
        </section>

        <label class="field">
          <span>Wi‑Fi 名称</span>
          <input
            id="ssid"
            name="ssid"
            maxlength="32"
            autocomplete="off"
            placeholder="手动输入 SSID"
          />
        </label>

        <label class="field">
          <span>Wi‑Fi 密码</span>
          <div class="password-row">
            <input
              id="password"
              name="password"
              type="password"
              maxlength="64"
              autocomplete="current-password"
              placeholder="开放网络可留空"
            />
            <button id="toggle-password" class="ghost-button inline-button" type="button">
              显示
            </button>
          </div>
        </label>

        <button id="submit" class="primary-button" type="button">保存并连接</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
