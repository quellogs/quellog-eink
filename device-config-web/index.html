<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quellog 配网</title>
  </head>
  <body>
    <main class="eink-shell">
      <section class="eink-panel">
        <header class="eink-header">
          <p class="eyebrow">QUELLOG</p>
          <h1>Wi-Fi 配网</h1>
        </header>

        <label class="field">
          <span>Wi‑Fi 名称</span>
          <input
            id="ssid"
            name="ssid"
            maxlength="32"
            autocomplete="off"
            placeholder="请输入 SSID"
          />
        </label>

        <label class="field">
          <span>Wi‑Fi 密码</span>
          <div class="password-row">
            <input
              id="password"
              name="password"
              type="password"
              maxlength="64"
              autocomplete="current-password"
              placeholder="请输入 Wi-Fi 密码"
            />
            <button id="toggle-password" class="ghost-button inline-button" type="button">
              显示
            </button>
          </div>
        </label>

        <fieldset class="field mode-field">
          <legend>IP 设置</legend>
          <label>
            <input type="radio" name="ip-mode" value="dhcp" checked />
            <span>DHCP</span>
          </label>
          <label>
            <input type="radio" name="ip-mode" value="static" />
            <span>手动 IP</span>
          </label>
        </fieldset>

        <section id="static-settings" class="static-settings" hidden>
          <label class="field">
            <span>IP 地址</span>
            <input id="ip" name="ip" inputmode="numeric" autocomplete="off" placeholder="请输入 IP 地址，如 192.168.1.50" />
          </label>
          <label class="field">
            <span>子网掩码</span>
            <input id="netmask" name="netmask" inputmode="numeric" autocomplete="off" placeholder="请输入子网掩码，如 255.255.255.0" />
          </label>
          <label class="field">
            <span>网关</span>
            <input id="gateway" name="gateway" inputmode="numeric" autocomplete="off" placeholder="请输入网关，如 192.168.1.1" />
          </label>
          <label class="field">
            <span>主 DNS</span>
            <input id="dns1" name="dns1" inputmode="numeric" autocomplete="off" placeholder="请输入主 DNS，如 223.5.5.5" />
          </label>
          <label class="field">
            <span>备 DNS</span>
            <input id="dns2" name="dns2" inputmode="numeric" autocomplete="off" placeholder="请输入备 DNS" />
          </label>
        </section>

        <button id="submit" class="primary-button" type="button">保存并连接</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>

        <section class="saved-networks" aria-labelledby="saved-title">
          <h2 id="saved-title">已保存网络</h2>
          <ul id="credentials" class="credentials-list"></ul>
        </section>
      </section>
    </main>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
